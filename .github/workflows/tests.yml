name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fachtests:
    name: Fachkern, Speicher und Schnittstelle (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests ohne Browser
        run: python -m unittest tests.test_domain tests.test_storage tests.test_api -v

  webtests:
    name: Adressparser und Portokorpus (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test "tests/js/*.test.mjs"

  oberflaeche:
    name: Durchlauf durch die Web-App im Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Playwright einrichten
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Erfassen, Suchen, Berichtigen
        # Die Texterkennung wird hier übersprungen: ihre Bestandteile werden
        # nicht im Repository gehalten. Sie ist vor jeder Freigabe auf einem
        # echten Gerät zu prüfen, nicht in der Bauumgebung.
        run: python -m unittest tests.test_oberflaeche -v

  hinweise:
    name: Keine Betriebsdaten im Repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbanken, Fotos und Geheimnisse aufspüren
        run: |
          set -e
          gefunden=$(git ls-files | grep -Ei '\.(sqlite3?|db|env|pem|key|p12|jpg|jpeg|heic)$' || true)
          if [ -n "$gefunden" ]; then
            echo "Diese Dateien gehören nicht in das Repository:"
            echo "$gefunden"
            exit 1
          fi
          echo "Keine Betriebsdaten im Repository."
